name: CI Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: 
      - '*'
  push:
    branches:
      - main
    # Prevents the badge-commit step below from re-triggering this workflow.
    paths-ignore:
      - 'badges/**'
  workflow_dispatch: {}

permissions:
  contents: write # Required to commit refreshed coverage/tests badges back to the repo
  pull-requests: write # Required to surface coverage reports in PR comments

jobs:
  editor-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 🏁 Checkout Repository
        uses: actions/checkout@v4
        with:
          # On PRs, commit badge updates onto the PR branch itself so they land
          # on main via the normal merge. On push (main), head_ref is empty and
          # checkout falls back to the ref that triggered the run, i.e. main.
          ref: ${{ github.head_ref }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
            editor/dashboard/package-lock.json

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov discord.py python-dotenv requests "genbadge[coverage,tests]"

      - name: 📦 Install Root Dependencies
        run: npm install

      - name: 🏗️ Install Sub-project Dependencies
        run: |
          npm install --prefix editor
          npm install --prefix editor/dashboard

      # Bot, editor, and dashboard suites run as independent steps (rather than
      # one chained `npm run test:all`) so that a failure in one suite doesn't
      # prevent the others from running and writing their coverage/junit
      # reports — those reports are what the badges below are generated from,
      # and we want the badges to reflect a failure, not silently go stale
      # because an earlier suite in the chain stopped everything else.
      - name: 🐍 Run Bot Unit Tests
        id: bot_tests
        continue-on-error: true
        run: npm run test:bot

      - name: 🟢 Run Editor Unit Tests
        id: editor_tests
        continue-on-error: true
        run: npm run test:editor

      - name: 🖥️ Run Dashboard Unit Tests
        id: dashboard_tests
        continue-on-error: true
        run: npm run test:dashboard

      - name: 📊 Surface Node Coverage Summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### 🟢 Node.js Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports generated for Editor and Dashboard." >> $GITHUB_STEP_SUMMARY

      # Combines lib/ (Python) coverage + junit results with editor/web-server.js
      # (Node API) coverage + junit results into badges/coverage-badge.svg and
      # badges/tests-badge.svg — generated fresh from this run's actual results
      # every time, not hardcoded. Scope matches the README's own coverage claim
      # (Python bot + Node API); the React dashboard is tracked separately and
      # isn't part of these two badges.
      - name: 🏷️ Generate coverage & tests badges
        if: always()
        run: python3 scripts/generate_badges.py

      - name: 💾 Commit updated badges
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage and test badges [skip ci]"
          file_pattern: badges/*.svg

      - name: 🚦 Fail job if any test suite failed
        if: steps.bot_tests.outcome == 'failure' || steps.editor_tests.outcome == 'failure' || steps.dashboard_tests.outcome == 'failure'
        run: |
          echo "::error::One or more test suites failed — see the suite steps above for details."
          exit 1

      - name: 🧹 Docker Environment Check
        run: |
          docker build -t test-editor ./editor
          docker build -t test-bot .

  bot-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 🏁 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Bot Dependencies
        run: |
          python -m pip install --upgrade pip
          # Standardizing on pytest-cov for CI coverage surfacing
          pip install pytest pytest-asyncio pytest-cov discord.py python-dotenv requests

      - name: 🧪 Run Bot Unit Tests
        run: npm run test:bot
#        run: PYTHONPATH=. pytest tests/

      - name: 📊 Surface Python Coverage
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: ./coverage.xml
          title: 🐍 Python Bot Coverage
          badge-title: Bot Coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false

  test-suite:
    runs-on: ubuntu-latest
    needs: [editor-tests, bot-tests]
    steps:
      - name: Success
        run: echo "All quality checks and coverage reports passed. Ready for merge."
